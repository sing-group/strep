# Secrets and machine specific settings come from environment variables
# (STREP_*) or from the optional, git-ignored file config/application-local.properties
spring.config.import=optional:file:config/application-local.properties

#spring.jpa.hibernate.ddl-auto=create
spring.jpa.hibernate.ddl-auto=update
# Kept enabled on purpose: several templates read lazy collections of Dataset
# (dataset.datatypes, dataset.language) after the controller has returned
spring.jpa.open-in-view=true

spring.datasource.url=${STREP_DB_URL:jdbc:mysql://127.0.0.1:3306/strep}
spring.datasource.username=${STREP_DB_USER:springuser}
spring.datasource.password=${STREP_DB_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Connection pool (HikariCP). Translated from the old Tomcat pool settings
# (initialSize/maxIdle, maxWait, validationQueryTimeout), which Hikari ignored.
# Hikari always validates connections on borrow (testOnBorrow); abandoned
# connections are not removed, only reported (logAbandoned/removeAbandonedTimeout)
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.leak-detection-threshold=60000

#spring.mvc.favicon.enabled=true

#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

spring.sql.init.mode=always
# data.sql must run after Hibernate has created/updated the schema
spring.jpa.defer-datasource-initialization=true

# Define a custom port instead of the default 8080
server.port=8443

# The format used for the keystore 
server.ssl.key-store-type=PKCS12
# The path to the keystore containing the certificate (not versioned, see README)
server.ssl.key-store=${STREP_KEYSTORE:file:config/keystore.p12}
# The password used to generate the certificate
server.ssl.key-store-password=${STREP_KEYSTORE_PASSWORD:changeme}
# The alias mapped to the certificate
server.ssl.key-alias=tomcat

#Definition of application name

#Definition of email send properties
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${STREP_MAIL_USERNAME:}
spring.mail.password=${STREP_MAIL_PASSWORD:}
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=true

#Disable whitelabel error for custom error pages
spring.web.error.whitelabel.enabled=false


#Variable used to indicate where the datasets are stored
dataset.storage=${STREP_DATASET_STORAGE:/var/lib/strep/datasets/}

#Variable used to indicate where the pipelines are stored
pipeline.storage=${STREP_PIPELINE_STORAGE:/var/lib/strep/pipelines/}

#Variable used to indicate where the csv are stored
csv.storage=${STREP_CSV_STORAGE:/var/lib/strep/csv/}

#Variable used to indicate the base url of the host
host.name=${STREP_HOST_NAME:https://localhost:8443}

#Multipart request configuration
spring.servlet.multipart.max-file-size = 500MB
spring.servlet.multipart.max-request-size = 500MB
